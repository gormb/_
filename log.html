<!doctype html><html lang=no><head><meta charset=utf-8><title>Log</title>
<script src=db.js></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui;max-width:72rem;margin:auto;padding:1rem}
td,th{border:1px solid #ccc;padding:.3rem;vertical-align:top}
table{border-collapse:collapse;width:100%;margin:.3rem 0 1.5rem}
code{background:#eee;padding:0 .2rem}
pre{background:#f4f4f4;padding:.5rem;overflow:auto;font-size:.75rem;white-space:pre-wrap;word-break:break-all}
label{display:inline-block;margin:.25rem .5rem .25rem 0}input,select{padding:.35rem;max-width:16rem}button{padding:.35rem .6rem}
</style>
</head><body><h2>Log</h2><div id=status></div><form id=filters><label>Key <input id=key placeholder="id"></label><label>Session <input id=session placeholder="sid"></label><label>Search <input id=search placeholder="URL, device, referrer"></label><label>Type <select id=type><option value="">All</option><option value="redirect">Redirects</option><option value="home">Homepage</option><option value="loggable">Loggable</option></select></label><label>Since <input id=since type=date></label><button>Filter</button><button id=clear type=button>Clear</button></form><div id=out></div>
<script>
const sb=supabase.createClient(SUPABASE.url,SUPABASE.publishableKey),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
$('status').innerHTML=SUPABASE.url.includes('YOUR-')?'⚠️ Konfigurer <b>db.js</b> først':'✅ '+SUPABASE.url
let rows=[],groups={}
const fmt=x=>new Date(x.ts).toLocaleString(),fingerprint=x=>[x.d?.ua,x.d?.p,x.d?.l,x.d?.z].filter(Boolean).join('|')
const details=x=>`<details><summary>detalj</summary><pre>${esc(JSON.stringify(x.d||{},null,2))}</pre></details>`
const where=x=>[x.d?.z,x.d?.l].filter(Boolean).join(' · ')||'Unknown'
const render=()=>{const f={key:$('key').value.trim().toLowerCase(),session:$('session').value.trim().toLowerCase(),search:$('search').value.trim().toLowerCase(),type:$('type').value,since:$('since').value};const rs=rows.filter(x=>{const text=JSON.stringify(x).toLowerCase(),sid=(x.d?.sid||fingerprint(x)).toLowerCase(),typeOK=!f.type||(f.type==='redirect'?!!x.u:f.type==='home'?!x.u:f.type==='loggable'?(x.k||'').startsWith('loggable'):true);return(!f.key||String(x.k||'').toLowerCase().includes(f.key))&&(!f.session||sid.includes(f.session))&&(!f.search||text.includes(f.search))&&typeOK&&(!f.since||x.ts.slice(0,10)>=f.since)});const sessions={};rs.forEach(x=>(sessions[x.d?.sid||fingerprint(x)||'unknown']??=[]).push(x));$('out').innerHTML=`<p>${rs.length} events in ${Object.keys(sessions).length} sessions. Location is an approximate timezone/language clue.</p>`+Object.entries(sessions).map(([sid,items])=>`<h3>Session <code>${esc(sid)}</code> (${items.length})</h3><table><tr><th>key</th><th>time</th><th>location</th><th>URL</th><th>details</th></tr>${items.map(x=>`<tr><td>${esc(x.k)}</td><td>${esc(fmt(x))}</td><td>${esc(where(x))}</td><td>${x.u?`<a target=_blank rel=noopener href="${esc(x.u)}">${esc(x.u.slice(0,70))}</a>`:'Homepage'}</td><td>${details(x)}</td></tr>`).join('')}</table>`).join('')||'<p>No matching events.</p>'}
const load=async()=>{if(SUPABASE.url.includes('YOUR-'))return;const[L,R]=await Promise.all([sb.from('log').select('*').order('ts',{ascending:false}).limit(2000),sb.from('redir').select('id,"group"')]);rows=L.data||[];groups=Object.fromEntries((R.data||[]).map(r=>[r.id,r.group]));render()}
$('filters').onsubmit=e=>{e.preventDefault();render()};$('clear').onclick=()=>{$('filters').reset();render()};load()
</script>
</body></html>
