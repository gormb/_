<!doctype html><html><head><style>img{padding-right:2vw}</style><script src=db.js></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><script>
const nt=h=>`</td></tr></table><h2>${h}</h2><table><tr><td>`, l=`</td></tr><tr><td>`

,dbA=async()=>SUPABASE.url.includes('YOUR-')?[]:(await sb.from('redir').select('id,"desc","group",sort').order('sort','id')).data

const db=await dbA();db.forEach(r=>r.id.endsWith('qr')?q[r.id.slice(0,-2)]=r:b.add(r.id))

for(const r of rows){if(r.group)g=r.group;if(g&&g!==pg){a.push(nt("<hr>"+g));pg=g;n=0}else if(n&&n%10===0)a.push(l);a.push(await c(r));n++}
return a.join("</td><td>")+"</td></tr></table>"}

,p=new URLSearchParams(location.search)
; (async()=>{

  if(u){Promise.resolve(log(k,u)).catch(()=>{});go(p,k,u)}else{Promise.resolve(log(k||'', '')).catch(()=>{});document.body.innerHTML='<h2>Generating QR codes...</h2>';document.body.innerHTML=await hp("https://gormb.github.io/_")}
