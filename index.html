<!doctype html><html><body><script>
const r = [
    ["d",   "/aniPublicOfficialReportSelfService/aniPublicOfficialReportSelfService_Html/wwwroot/Book"],
    ["ldd", "/aniPublicOfficialReportSelfService/aniPublicOfficialReportSelfService_Html/wwwroot/Book?book=LifeDemandedDeath.pdf"]
];
let p=new URLSearchParams(location.search), key=p.keys().next().value, x= r.find(([t])=>t==key);
if (x) {
    p.delete(key);
    let q = p.toString();
    location.replace(x[1] + (q?(x[1].includes("?")?"&":"?")+q:""));
}
else document.body.innerHTML=r.map(([t])=>`<a href="?${t}">${t}</a>`).join("<br>");
</script></body></html>
