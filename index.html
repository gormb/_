<!doctype html><html><body><script>

let p=new URLSearchParams(location.search),x=r.find(([t])=>t==p.keys().next().value);
if(x){
 p.delete(x[0]);
 location.replace(x[1]+(p.size?(x[1].includes("?")?"&":"?")+p:""));
}else document.body.innerHTML=r.map(([t])=>`<a href="?${t}">${t}</a>`).join("");

</script></body></html>
